# Local development environment.
# Step 1: only the database runs in Docker. In Step 2 we add the backend and frontend containers here.
services:
  db:
    image: postgres:17-alpine
    container_name: noteshub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noteshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noteshub}
      POSTGRES_DB: ${POSTGRES_DB:-noteshub}
    ports:
      - "5432:5432"            # host:container — lets the app on your PC reach the DB
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:               # Docker checks if Postgres is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
